name: Inference backend CI

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "build/**"
      - develop
  pull_request:
    branches:
      - main
      - develop
      - "feature/**"
      - "build/**"

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-gnu:
    name: Windows GNU (original target)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain
          path-type: inherit

      - name: Verify GNU linker tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command dlltool.exe, gcc.exe | Select-Object Name, Source | Format-Table -AutoSize
          dlltool.exe --version
          gcc.exe --version

      - name: Install Rust GNU toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = Join-Path $env:USERPROFILE '.rustup/toolchains/1.99.1-x86_64-pc-windows-gnu/bin'
          "ORDIS_RUST_BIN=$bin" >> $env:GITHUB_ENV
          "RUSTC=$bin/rustc.exe" >> $env:GITHUB_ENV
          "RUSTDOC=$bin/rustdoc.exe" >> $env:GITHUB_ENV
          'RUSTUP_AUTO_INSTALL=0' >> $env:GITHUB_ENV
          & "$bin/rustc.exe" --version --verbose
          Get-FileHash "$bin/rustc.exe", "$bin/cargo.exe", app/Cargo.lock -Algorithm SHA256
          git rev-parse HEAD

      - name: Install Node.js and Python
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject private or generated files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tracked = git ls-files
          $forbidden = $tracked | Where-Object {
            $_ -match '(^|/)(runtime|target|node_modules|venv|\.venv|__pycache__)(/|$)' -or
            $_ -match '(^|/)(\.env($|\.)|AGENTS\.local\.md|api_tokens\.yml|token\.dpapi|llama-api-key\.dpapi)$' -or
            $_ -match '\.(gguf|exl3|safetensors|dpapi|sqlite|sqlite3|db|wal|shm|embedding|embeddings|pem|p12|pfx|key|log)$' -or
            $_ -match '\.(sqlite3?|db)-(wal|shm|journal)$' -or
            $_ -match '(?i)(^|/)(private|dados-privados|lucille-local|memorias|memories|embeddings|backups)(/|$)'
          }
          if ($forbidden) {
            Write-Error "Private/generated files are tracked:`n$($forbidden -join "`n")"
          }

      - name: Private profile and memory path guard
        shell: pwsh
        run: python scripts/privacy_guard.py

      - name: Check formatting of changed Rust modules
        shell: pwsh
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $base = $env:CI_BASE_SHA
          if ($base -notmatch '^(?!0{40}$)[0-9a-f]{40}$') {
            $base = git merge-base HEAD origin/main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $changed = @(git -c core.quotepath=false diff --name-only --diff-filter=ACMR "$base...HEAD" -- '*.rs')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in $changed) {
            & "$env:ORDIS_RUST_BIN/rustfmt.exe" --edition 2021 --config skip_children=true --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem app/ui -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node --test scripts/test-*.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Python tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Verify test launcher preserves existing private data
        shell: pwsh
        run: ./scripts/test-test-launcher.ps1

      - name: Run Rust and mock-server tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'cargo-test-gnu.log'
          & "$env:ORDIS_RUST_BIN/cargo.exe" test --verbose --locked --manifest-path app/Cargo.toml 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows test binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'cargo-build-gnu-release.log'
          & "$env:ORDIS_RUST_BIN/cargo.exe" build --release --locked --manifest-path app/Cargo.toml 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate generation completion and tool rejection against mocks
        shell: pwsh
        run: python -B scripts/test-generation-integration.py --cli app/target/release/ordis-cli.exe

      - name: Validate human control protocol and scoped Ctrl+C
        shell: pwsh
        run: python -B scripts/test-cli-control.py --cli app/target/release/ordis-cli.exe

      - name: Assemble privacy-safe test ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'ORDIS-Windows-Test'
          $appOut = Join-Path $stage 'app'
          New-Item -ItemType Directory -Force $appOut, (Join-Path $appOut 'ui'), (Join-Path $stage 'config'), (Join-Path $stage 'scripts'), (Join-Path $stage 'agente/workspace'), (Join-Path $stage 'docs') | Out-Null
          Copy-Item app/target/release/ordis.exe (Join-Path $appOut 'ORDIS.exe')
          Copy-Item app/target/release/ordis-cli.exe (Join-Path $appOut 'ordis-cli.exe')
          $loader = Get-Item app/target/release/WebView2Loader.dll -ErrorAction SilentlyContinue
          if (-not $loader) { $loader = Get-ChildItem app/target -Recurse -File -Filter WebView2Loader.dll | Where-Object { $_.FullName -match '\\x64\\WebView2Loader\.dll$' } | Select-Object -First 1 }
          if (-not $loader) { throw 'WebView2Loader.dll x64 não foi encontrado na saída GNU do Tauri.' }
          Write-Host "WebView2 loader: $($loader.FullName)"
          Copy-Item $loader.FullName $appOut
          Copy-Item app/ui/ordis.png (Join-Path $appOut 'ui/ordis.png')
          Copy-Item config/paths.json, config/tabbyapi-inicial.yml, config/ordis_qwen_thinking.yml, config/runtime-packages.txt, config/images-requirements.lock.txt, config/README.md (Join-Path $stage 'config')
          Copy-Item scripts/serve_inference.py, scripts/service_shutdown.py, scripts/agent_web_search.py, scripts/ordis_token_monitor.py, scripts/token_counter_paths.py (Join-Path $stage 'scripts')
          Copy-Item agente/workspace/AGENTS.md (Join-Path $stage 'agente/workspace/AGENTS.md')
          Copy-Item docs/GENERATION-SAFETY.md, docs/LLAMA-CPP-GGUF.md, docs/TESTE-WINDOWS-LLAMA-CPP.md, docs/FASE-2-CONFIGURACOES.md, docs/FASE-3-MEMORIA.md, docs/FASE-3-METRICAS.md, docs/FASE-3-1-IDENTIDADE.md, docs/FASE-3-2-CONFIABILIDADE.md, docs/FASE-4-1-DESENVOLVEDOR.md, docs/FASE-3-3-MEMORIA-ATIVA.md, docs/FASE-3-4-SEMANTICA-VISAO.md (Join-Path $stage 'docs')
          Copy-Item scripts/Iniciar-ORDIS-Teste.ps1 (Join-Path $stage 'Iniciar-ORDIS-Teste.ps1')
          $forbidden = Get-ChildItem $stage -Recurse -File | Where-Object {
            $_.Extension -match '^\.(gguf|exl3|safetensors|dpapi|sqlite|sqlite3|db|wal|shm|pem|p12|pfx|key|log)$' -or
            $_.Name -match '(?i)(api[_-]?tokens?\.yml|llama-api-key|secret|credential|history|memory|embedding|backup|\.env)'
          }
          if ($forbidden) { throw "Arquivo privado/indevido no pacote: $($forbidden.FullName -join ', ')" }
          $zip = Join-Path $env:RUNNER_TEMP 'ORDIS-Windows-Test.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Select-Object FullName, Length | Format-List

      - name: Validate packaged identity and memory using synthetic backend
        shell: pwsh
        run: python scripts/test-release-identity.py "${{ runner.temp }}/ORDIS-Windows-Test.zip"

      - name: Validate reliability scenarios using synthetic data
        shell: pwsh
        run: python scripts/test-release-reliability.py "${{ runner.temp }}/ORDIS-Windows-Test.zip"

      - name: Validate developer tool cycle with synthetic backend
        shell: pwsh
        run: python scripts/test-release-developer.py "${{ runner.temp }}/ORDIS-Windows-Test.zip"

      - name: Validate active memory tool cycle on packaged binaries
        shell: pwsh
        run: python scripts/test-release-active-memory.py "${{ runner.temp }}/ORDIS-Windows-Test.zip"

      - name: Validate semantic retrieval and private attachments on packaged binaries
        shell: pwsh
        run: python scripts/test-release-semantic-vision.py "${{ runner.temp }}/ORDIS-Windows-Test.zip"

      - name: Upload Windows test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ORDIS-Windows-Test-${{ github.sha }}
          path: ${{ runner.temp }}/ORDIS-Windows-Test.zip
          if-no-files-found: error
          retention-days: 14

      - name: Package generic GUI and CLI provenance
        shell: pwsh
        run: |
          $loader = Join-Path $env:RUNNER_TEMP 'ORDIS-Windows-Test/app/WebView2Loader.dll'
          python -B scripts/package-paired.py --bin-dir app/target/release --loader $loader --output "${{ runner.temp }}/ORDIS-Paired"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "${{ runner.temp }}/ORDIS-Paired/*" -DestinationPath "${{ runner.temp }}/ORDIS-Paired.zip"

      - name: Build guarded Lucille staging pair
        shell: pwsh
        run: |
          & "$env:ORDIS_RUST_BIN/cargo.exe" build --release --locked --features staging-interface --manifest-path app/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/test-cli-control.py --cli app/target/release/ordis-cli.exe --official-staging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $loader = Join-Path $env:RUNNER_TEMP 'ORDIS-Windows-Test/app/WebView2Loader.dll'
          python -B scripts/package-paired.py --bin-dir app/target/release --loader $loader --output "${{ runner.temp }}/Lucille-Paired-Staging" --official-staging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "${{ runner.temp }}/Lucille-Paired-Staging/*" -DestinationPath "${{ runner.temp }}/Lucille-Paired-Staging.zip"

      - name: Upload paired distributions
        uses: actions/upload-artifact@v4
        with:
          name: CLI-GUI-Paired-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ORDIS-Paired.zip
            ${{ runner.temp }}/Lucille-Paired-Staging.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload GNU build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-gnu-log
          path: ${{ runner.temp }}/cargo-test-gnu.log
          if-no-files-found: ignore

      - name: Upload GNU release build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-build-gnu-release-log
          path: ${{ runner.temp }}/cargo-build-gnu-release.log
          if-no-files-found: ignore

  windows-msvc-compatibility:
    name: Windows MSVC compatibility check
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Visual C++ environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-msvc --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = Join-Path $env:USERPROFILE '.rustup/toolchains/1.99.1-x86_64-pc-windows-msvc/bin'
          "ORDIS_RUST_BIN=$bin" >> $env:GITHUB_ENV
          "RUSTC=$bin/rustc.exe" >> $env:GITHUB_ENV
          "RUSTDOC=$bin/rustdoc.exe" >> $env:GITHUB_ENV
          'RUSTUP_AUTO_INSTALL=0' >> $env:GITHUB_ENV
          & "$bin/rustc.exe" --version --verbose
          Get-FileHash "$bin/rustc.exe", "$bin/cargo.exe", app/Cargo.lock -Algorithm SHA256
          git rev-parse HEAD

      - name: Run Rust tests without changing the repository target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'cargo-test-msvc.log'
          & "$env:ORDIS_RUST_BIN/cargo.exe" test --verbose --locked --manifest-path app/Cargo.toml 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build both MSVC binaries and validate control protocol
        shell: pwsh
        run: |
          & "$env:ORDIS_RUST_BIN/cargo.exe" build --locked --manifest-path app/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/test-cli-control.py --cli app/target/debug/ordis-cli.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload MSVC build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-msvc-log
          path: ${{ runner.temp }}/cargo-test-msvc.log
          if-no-files-found: ignore

  credential-scan:
    name: Credential scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for credentials
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: latest
          GITLEAKS_ENABLE_COMMENTS: false
