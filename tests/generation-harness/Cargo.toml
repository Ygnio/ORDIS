[package]
name = "ordis-generation-validation"
version = "0.1.0"
edition = "2021"
publish = false

[[example]]
name = "local_validation"
required-features = ["transport"]

[features]
default = []
transport = ["dep:reqwest", "dep:tokio", "dep:futures-util"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", optional = true }
reqwest = { version = "=0.13.5", optional = true, default-features = false, features = ["json", "stream"] }
tokio = { version = "1", optional = true, features = ["rt", "time", "net", "macros"] }
